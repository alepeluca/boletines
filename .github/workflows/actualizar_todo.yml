name: Automatización Diario y Control de Estructura

on:
  schedule:
    - cron: '0 3 * * *' # Corre todos los días a las 3:00 AM
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-level: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # NOTA: Los scripts de abajo los iremos modificando en el siguiente paso para que escriban 
    # directamente en sus carpetas correspondientes, pero los dejamos declarados aquí.
    - name: Ejecutar Scraping y Extracción de Chunks
      run: |
        python scripts/update_boletines.py || echo "Fallo en boletines pero continuamos"
        python scripts/update_licitaciones.py || echo "Fallo en licitaciones pero continuamos"

    - name: Forzar Mantenimiento y Formato de Carpetas
      run: |
        python scripts/migrar_estructura.py

    - name: Confirmar cambios y hacer Push Seguro
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add json_chunks/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Mantenimiento automatizado: Orden de subcarpetas y normalización de dígitos" && git pull --rebase origin main && git push origin main)
