# .github/workflows/automatizacion.yml

```yaml
name: Sistema Unificado Boletines 2026

on:
  workflow_dispatch:

  schedule:
    - cron: '30 10 * * 1-5'

permissions:
  contents: write

jobs:
  ejecutar:

    runs-on: ubuntu-latest

    steps:

      - name: 📥 Clonar repo
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests PyMuPDF

      - name: ⚙️ Ejecutar script
        run: python ejecutador_unico.py

      - name: 🔎 Ver cambios
        id: verify-changed-files
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 🚀 Commit automático
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Actualización automática de boletines"
          file_pattern: "json_chunks/*.jsonl"
