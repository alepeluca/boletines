name: Sistema Unificado Boletines 2026

on:

  workflow_dispatch:

  schedule:
    - cron: '30 10 * * 1-5'

permissions:
  contents: write

jobs:

  ejecutar:

    runs-on: ubuntu-latest

    steps:

      - name: 📥 Clonar repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests PyMuPDF beautifulsoup4

      - name: 🔎 Verificar chunks existentes
        run: |
          echo "===== JSON CHUNKS ====="
          ls -lah json_chunks | tail -20 || true

      - name: ⚙️ Ejecutar update_boletines.py
        run: |
          python scripts/update_boletines.py

      - name: 🔎 Verificar nuevos archivos
        run: |
          echo "===== STATUS ====="
          git status

          echo ""
          echo "===== ÚLTIMOS CHUNKS ====="
          ls -lah json_chunks | tail -20 || true

      - name: 🚀 Commit y push automático
        run: |

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add json_chunks/*.jsonl

          if git diff --cached --quiet; then
            echo "✅ No hay cambios para commitear."
          else
            git commit -m "🤖 Actualización automática de boletines"
            git push
          fi
