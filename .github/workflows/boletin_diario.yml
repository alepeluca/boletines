name: Procesar boletín diario

on:
  schedule:
    - cron: "30 8 * * *"  # todos los días a las 8:30 UTC (~5:30 Argentina)
  workflow_dispatch:  # permite ejecutarlo manualmente también

permissions:
  contents: write  # Permite al bot guardar los archivos en el repo

jobs:
  procesar-boletin:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repo
        uses: actions/checkout@v4

      - name: 🐍 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf requests

      - name: ⚙️ Ejecutar script
        run: python procesar_boletin.py

      - name: 🚀 Guardar cambios en la web
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Nuevo boletín procesado"
          file_pattern: "json_chunks/*.jsonl"
