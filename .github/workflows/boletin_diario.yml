name: Procesar boletín diario

on:
  schedule:
    - cron: "30 8 * * *"  # todos los días a las 8:30 UTC (~5:30 Argentina)
  workflow_dispatch:  # permite ejecutarlo manualmente también

permissions:
  contents: write  # Permite al bot escribir y hacer push en el repo

jobs:
  procesar-boletin:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf requests

      - name: ⚙️ Ejecutar script
        run: python procesar_boletin.py

      - name: 🚀 Commit y push si hay cambios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "boletin-bot"
          git config user.email "bot@boletines.local"
          
          # URL CORREGIDA: Ahora Git se puede autenticar correctamente contra internet
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git"
          
          # 1. Agregamos los archivos generados
          git add json_chunks/*.jsonl
          
          # 2. Traemos lo de la web y resolvemos conflictos priorizando al bot
          git fetch origin main
          git merge origin/main -X theirs --allow-unrelated-histories -m "🤖 Sincronización automática previa" || true
          
          # 3. Verificamos si quedaron cosas nuevas listas para subir
          if git diff --cached --quiet; then
            echo "Sin cambios para subir."
          else
            git commit -m "🤖 Nuevo boletín procesado"
            git push origin main
          fi
