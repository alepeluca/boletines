name: Procesar boletín diario

on:
  schedule:
    - cron: "30 8 * * *"  # todos los días a las 8:30 UTC (~5:30 Argentina)
  workflow_dispatch:  # permite ejecutarlo manualmente también

permissions:
  contents: write  # 👈 AGREGADO: Permite al bot escribir y hacer push en el repo

jobs:
  procesar-boletin:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 👈 AGREGADO: Descarga todo el historial necesario para hacer el pull/rebase

      - name: 🐍 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf requests

      - name: ⚙️ Ejecutar script
        run: python procesar_boletin.py

      - name: 🚀 Commit y push si hay cambios
        run: |
          git config user.name "boletin-bot"
          git config user.email "bot@boletines.local"
          git add json_chunks/*.jsonl
          
          if git diff --cached --quiet; then
            echo "Sin cambios para subir."
          else
            git commit -m "🤖 Nuevo boletín procesado"
            git pull --rebase origin main  # 👈 AGREGADO: Trae lo nuevo de la web antes de mandar el push
            git push origin main
          fi
