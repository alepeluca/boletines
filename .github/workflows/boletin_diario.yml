name: Procesar boletín diario

on:
  schedule:
    - cron: "30 8 * * *"  # todos los días a las 8:30 UTC (~5:30 Argentina)
  workflow_dispatch:  # permite ejecutarlo manualmente también

permissions:
  contents: write  # Permite al bot escribir y hacer push en el repo

jobs:
  procesar-boletin:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Descarga todo el historial necesario para resolver diferencias

      - name: 🐍 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf requests

      - name: ⚙️ Ejecutar script
        run: python procesar_boletin.py

      - name: 🚀 Commit y push si hay cambios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "boletin-bot"
          git config user.email "bot@boletines.local"
          
          # Autentica a Git para operaciones remotas
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git
          
          git add json_chunks/*.jsonl
          
          if git diff --cached --quiet; then
            echo "Sin cambios para subir."
          else
            git commit -m "🤖 Nuevo boletín procesado"
            
            # Trae lo de la web, pero si hay conflicto con los JSON, GANA LO QUE CREÓ EL BOT
            git pull --rebase -X theirs origin main
            
            git push origin main
          fi
