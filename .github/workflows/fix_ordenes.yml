name: Fix URLs Orden del Dia

on:
  workflow_dispatch: # Permite lanzar la acción a mano desde la pestaña "Actions"

jobs:
  fix-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar script de corrección
        run: python scripts/fix_urls_ordenes.py

      - name: Guardar los cambios (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add json_chunks/
          # Hacemos commit solo si el script modificó algún archivo
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fix: Corrección masiva de URLs de Google Drive para Ordenes del Día" && git push)
