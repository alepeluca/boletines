name: Actualizar Índice CSV Automáticamente

on:
  push:
    branches:
      - main
    paths:
      - 'json_chunks/**/*.jsonl'  # Se dispara en cadena automáticamente cuando entra un chunk
  workflow_dispatch:              # <-- ¡ESTO PERMITE LA PRIMERA CORRIDA MANUAL DESDE LA WEB!

jobs:
  build-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Compilador de Índice CSV
        run: |
          python scripts/generar_indice.py

      - name: Commit and Push del índice actualizado
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          git add indice_documentos.csv
          
          if git diff --staged --quiet; then
            echo "[INFO] El índice CSV ya estaba actualizado. No se requieren cambios."
          else
            git commit -m "Autogeneración de índice_documentos.csv [Skip GitHub Actions]"
            git pull --rebase origin main
            git push origin main
          fi
