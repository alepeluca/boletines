name: Actualizar Índice CSV Automáticamente

on:
  push:
    branches:
      - main
    paths:
      - 'json_chunks/**/*.jsonl'  # Se dispara SOLO si cambia o se agrega un chunk

jobs:
  build-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Trae todo el historial para evitar conflictos en el rebase

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Compilador de Índice CSV
        run: |
          python scripts/generar_indice.py

      - name: Commit and Push del índice actualizado
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # Agregamos solo el archivo del índice generado
          git add indice_documentos.csv
          
          # Verificamos si realmente hubo cambios en el CSV antes de commitear
          if git diff --staged --quiet; then
            echo "[INFO] El índice CSV ya estaba actualizado. No se requieren cambios."
          else
            git commit -m "Autogeneración diaria de índice_documentos.csv [Skip GitHub Actions]"
            
            # El pull --rebase previene rebotes si otro scraper subió algo en simultáneo
            git pull --rebase origin main
            git push origin main
          fi
