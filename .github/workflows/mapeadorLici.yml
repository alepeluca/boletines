name: Mapeador de Licitaciones

on:
  workflow_dispatch: # Esto te permite activar el script manualmente con un botón

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerias requeridas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script de mapeo
      run: python mapeador.py
