name: Mover y Actualizar Boletines

on:
  workflow_dispatch:

jobs:
  migrar-boletines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar script de migración e inyección
        run: python scripts/mover_e_inyectar_urls.py

      - name: Limpiar y Finalizar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Borramos la carpeta temporal de normalización
          git rm -rf json_chunks/bolet_normalizado/ || true
          
          # Agregamos la carpeta final 'bolet' ya corregida
          git add json_chunks/bolet/
          
          git commit -m "Fix: Boletines unificados en carpeta 'bolet' con URLs de descarga directa"
          git push
