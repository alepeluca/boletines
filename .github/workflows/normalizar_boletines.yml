name: Normalizar Chunks de Boletines

on:
  workflow_dispatch: # Te permite ejecutarlo a mano desde la pestaña Actions

jobs:
  normalize-boletines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar script de normalizacion
        run: python scripts/normalizar_boletines.py

      - name: Guardar la nueva carpeta en Git (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Añadimos la nueva carpeta generada por el script
          git add json_chunks/bolet_normalizado/
          
          # Hacemos el commit y push solo si realmente hay archivos nuevos creados
          git diff --quiet && git diff --staged --quiet || (git commit -m "Docs: Crear estructura normalizada en bolet_normalizado (1 chunk = 1 boletin)" && git push)
