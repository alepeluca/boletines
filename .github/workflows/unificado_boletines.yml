name: Automatización General de Boletines

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'  # De lunes a viernes a las 10:30 UTC (7:30 AM hora Argentina)

permissions:
  contents: write  # Permite al bot guardar los archivos en el repo

jobs:
  procesar-y-actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repo
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm PyMuPDF beautifulsoup4

      - name: ⚙️ Ejecutar Sistema Unificado de Boletines
        run: python procesar_boletin.py

      - name: 🚀 Guardar todos los cambios en la web
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Procesamiento automático de boletines (Fase 1 y Fase 2)"
          file_pattern: "json_chunks/* pdfs/*"
