name: Actualizar boletines

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'  # Corre de lunes a viernes a las 10:30 UTC (7:30 hora Argentina)

permissions:
  contents: write  # Permite hacer git push desde GitHub Actions

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm PyMuPDF beautifulsoup4

      - name: Ejecutar actualización de boletines
        run: python scripts/update_boletines.py

      - name: Subir cambios (si los hay)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Sin cambios para subir."
          else
            git commit -m "Actualización automática de boletines"
            git push
          fi
