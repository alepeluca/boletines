name: Actualización Diaria de Licitaciones

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # REGLA CLAVE: Instalar el motor Tesseract nativo de Linux y sus diccionarios en español
    - name: Instalar Tesseract OCR en el sistema operativo
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

    - name: Instalar librerías necesarias de Python
      run: |
        python -m pip install --upgrade pip
        pip install pymupdf requests pytesseract pdf2image

    - name: Ejecutar script de licitaciones
      run: python scripts/update_licitaciones.py

    - name: Guardar cambios y subir al repositorio
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add json_chunks/
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Nuevo chunk de licitación procesado con OCR" && git push)
