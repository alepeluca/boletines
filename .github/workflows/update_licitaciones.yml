name: Actualización Diaria de Licitaciones

on:
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Tesseract OCR en el sistema operativo
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

    - name: Instalar librerías necesarias de Python
      run: |
        python -m pip install --upgrade pip
        pip install pymupdf requests pytesseract Pillow

    - name: Ejecutar script de licitaciones masivo
      run: python scripts/update_licitaciones.py

    - name: Guardar cambios y subir los chunks al repositorio
      if: always() # Guarda el progreso acumulado INCLUSO si la corrida se interrumpe por límite de tiempo
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add json_chunks/
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Chunks del lote de licitaciones agregados" && git push)
