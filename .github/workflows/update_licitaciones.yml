name: Actualización Diaria de Licitaciones

on:
  schedule:
    # Corre todos los días a las 04:00 AM hora UTC (01:00 AM hora de Argentina)
    - cron: '0 4 * * *'
  workflow_dispatch: # Mantiene el botón para que puedas correrlo a mano cuando quieras

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install pymupdf requests

    - name: Ejecutar script de licitaciones
      run: python update_licitaciones.py

    - name: Guardar cambios y subir al repositorio
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add json_chunks/
        # Solo hace commit si realmente hay un nuevo chunk de licitación guardado
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Nuevo chunk de licitación agregado" && git push)
