name: 📄 Actualización con OCR de Órdenes del Día

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: '¿Forzar corrida OCR histórica completa?'
        required: true
        type: boolean
        default: true

  schedule:
    - cron: '30 4 * * *' # Corre todos los días a las 04:30 AM (Hora UTC)

jobs:
  update-ordenes:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'
          cache: 'pip'

      - name: 🖨️ Instalar Binarios de Tesseract OCR y Paquete Español
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: 📦 Instalar Dependencias de Python
        run: |
          pip install requests PyMuPDF pytesseract Pillow

      - name: 🗜️ Ejecutar Escaneo, Descarga y OCR en Lote
        run: |
          if [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            python scripts/update_ordenes.py --force
          else
            python scripts/update_ordenes.py
          fi

      - name: 🚀 Subir Cambios a GitHub (json_chunks/)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add json_chunks/
          
          if git diff --staged --quiet; then
            echo "No se detectaron nuevas órdenes del día para guardar."
          else
            git commit -m "📄 Sincronización incremental con OCR de Órdenes del Día [skip ci]"
            git push origin main
          fi
