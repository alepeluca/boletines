- name: 🚀 Subir Cambios a GitHub (json_chunks/)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add json_chunks/
          
          if git diff --staged --quiet; then
            echo "No se detectaron nuevas órdenes del día para guardar."
          else
            git commit -m "📄 Sincronización incremental con OCR de Órdenes del Día [skip ci]"
            # Trae de forma segura los cambios remotos que se hicieron mientras corría el OCR
            git pull --rebase origin main
            git push origin main
          fi
