name: 🎙️ Actualización Automática de Actas Taquigráficas

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: '¿Forzar corrida completa e ignorar el calendario?'
        required: true
        type: boolean
        default: true

  schedule:
    - cron: '0 4 * * *'

jobs:
  update-taqui:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'
          cache: 'pip'

      - name: 📦 Instalar Dependencias
        run: |
          pip install requests PyMuPDF

      - name: 🗜️ Ejecutar Descarga y Chunking Secuencial
        run: |
          if [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            python scripts/update_taquigraficas.py --force
          else
            python scripts/update_taquigraficas.py
          fi

      - name: 🚀 Subir Cambios a GitHub (json_chunks/)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add json_chunks/
          
          if git diff --staged --quiet; then
            echo "No se detectaron nuevas actas para guardar hoy."
          else
            git commit -m "🎙️ Sincronización ordenada de Actas Taquigráficas [skip ci]"
            git push origin main
          fi
