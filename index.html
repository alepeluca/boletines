<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador Integrado Municipal</title>
  <link href="https://fonts.googleapis.com/css2?family=Mohave&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mohave', sans-serif; margin: 2rem auto; max-width: 1200px; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; }
    #ultimaActualizacion { font-weight: bold; margin-bottom: 1rem; width: 100%; max-width: 900px; }
    #searchContainer, #dateContainer { width: 100%; max-width: 900px; margin-bottom: 1rem; }
    #searchOptions, #categoryOptions { display: flex; gap: 1rem; margin-bottom: 1rem; justify-content: center; flex-wrap: wrap; }
    #categoryOptions { background: #e2e8f0; padding: 0.7rem; border-radius: 8px; border: 1px solid #cbd5e1; }
    #resultados { width: 90%; max-width: 1200px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; max-height: 500px; overflow-y: auto; }
    
    .resultado { border: 2px solid blue; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; cursor: pointer; }
    .resultado.licitacion { border-color: #e67e22; }
    .resultado.hcd_orden { border-color: #2ecc71; }
    .resultado.hcd_taqui { border-color: #9b59b6; }
    
    .linea { font-weight: bold; margin-bottom: .5rem; }
    
    .badge { display: inline-block; padding: 0.2rem 0.5rem; font-size: 0.8rem; border-radius: 4px; color: #fff; margin-right: 0.5rem; text-transform: uppercase; }
    .badge-boletin { background-color: blue; }
    .badge-lici { background-color: #e67e22; }
    .badge-orden { background-color: #2ecc71; }
    .badge-taqui { background-color: #9b59b6; }
    
    .fragmento { white-space: pre-wrap; }
    #pdfPreview { width: 100%; max-width: 900px; min-height: 600px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    #pdfPreview iframe { width: 100%; height: 600px; border: none; }
    #status, #contador { width: 100%; text-align: center; margin: .5rem 0; }
    progress { width: 100%; max-width: 900px; }
    #version { margin-top: 1rem; color: #666; font-size: .9rem; }
  </style>
</head>
<body>

  <div id="ultimaActualizacion">Sincronizando con base de datos remota…</div>

  <div id="searchContainer">
    <div id="categoryOptions">
      <label><input type="checkbox" id="cat-boletines" value="boletines" checked> Boletines Oficiales</label>
      <label><input type="checkbox" id="cat-licitaciones" value="licitaciones" checked> Licitaciones Públicas</label>
      <label><input type="checkbox" id="cat-hcd-orden" value="hcd_orden" checked> HCD: Órdenes del Día</label>
      <label><input type="checkbox" id="cat-hcd-taqui" value="hcd_taqui" checked> HCD: Taquigráficas</label>
    </div>

    <div id="searchOptions">
      <label><input type="radio" name="searchType" value="contains" checked> Contiene</label>
      <label><input type="radio" name="searchType" value="endsWith"> Termina en</label>
      <label><input type="radio" name="searchType" value="or"> Alguna palabra</label>
    </div>
    <input id="busqueda" placeholder="Escribí una palabra y presioná Enter…" style="width:100%;padding:.5rem;font-size:1rem" />
  </div>

  <div id="dateContainer">
    <label>Desde: <input type="month" id="desde" /></label>
    <label>Hasta: <input type="month" id="hasta" /></label>
    <select id="orden">
      <option value="desc">Más nuevos primero</option>
      <option value="asc">Más antiguos primero</option>
    </select>
    <button id="botonBuscar">Buscar</button>
  </div>

  <progress id="progressBar" max="100" value="0"></progress>

  <div id="seccionDescargas" style="width: 100%; max-width: 900px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 0.5rem 0 1rem 0; box-sizing: border-box;">
    <h4 style="margin: 0 0 0.4rem 0; display:flex; align-items:center; gap:0.5rem;">📅 Índice de Archivos y Descargas Directas</h4>
    
    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.8rem;">
      <label>Filtrar Año: <select id="descFiltroAnno"><option value="TODOS">Todos los años</option></select></label>
      <label><input type="checkbox" id="descDesagregarMensual" checked> Desagregar meses</label>
      <span id="descCargandoStatus" style="font-size:0.85rem; color:#666; font-style:italic;">Leyendo índice unificado…</span>
    </div>
    
    <div id="descContenedorEnlaces" style="max-height: 200px; overflow-y: auto; padding: 0.5rem; border: 1px dashed #ccc; border-radius: 4px; background: #fafafa; display: flex; flex-direction: column; gap: 0.6rem;">
      <span style="color:#888; font-size:0.85rem; font-style:italic; text-align:center;">Construyendo grilla de descargas…</span>
    </div>
  </div>

  <div id="status"></div>
  <div id="contador"></div>
  <div id="resultados"></div>
  <div id="pdfPreview"></div>
  <div id="version">V1.1.0 (Estructura Corregida)</div>

<script>
  const ultimaDiv = document.getElementById('ultimaActualizacion');
  const busquedaInput = document.getElementById('busqueda');
  const botonBuscar = document.getElementById('botonBuscar');
  const resultadosDiv = document.getElementById('resultados');
  const pdfPreview = document.getElementById('pdfPreview');
  const statusDiv = document.getElementById('status');
  const contadorDiv = document.getElementById('contador');
  const progressBar = document.getElementById('progressBar');
  const desdeInput = document.getElementById('desde');
  const hastaInput = document.getElementById('hasta');
  const ordenSelect = document.getElementById('orden');

  const descFiltroAnno = document.getElementById('descFiltroAnno');
  const descDesagregarMensual = document.getElementById('descDesagregarMensual');
  const descCargandoStatus = document.getElementById('descCargandoStatus');
  const descContenedorEnlaces = document.getElementById('descContenedorEnlaces');

  let baseDocumentosIndexados = []; 
  let documentosUnicosParaDescarga = [];

  const CONFIG_CATEGORIAS = {
    boletines: { label: 'Boletín', badgeClass: 'badge-boletin', resultClass: '', colorHex: '#0000ff' },
    licitaciones: { label: 'Licitación', badgeClass: 'badge-lici', resultClass: 'licitacion', colorHex: '#e67e22' },
    hcd_orden: { label: 'HCD Orden', badgeClass: 'badge-orden', resultClass: 'hcd_orden', colorHex: '#2ecc71' },
    hcd_taqui: { label: 'HCD Taquigráfica', badgeClass: 'badge-taqui', resultClass: 'hcd_taqui', colorHex: '#9b59b6' }
  };

  // Parser dinámico inteligente
  function parsearCSV(text) {
    const lines = text.split(/\r?\n/);
    if (lines.length === 0) return [];
    
    // Obtenemos los nombres de las columnas limpias del primer renglón
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/^"|"$/g, ''));
    const rows = [];

    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;

      let arr = [];
      let insideQuote = false;
      let entry = '';

      for (let j = 0; j < line.length; j++) {
        let char = line[j];
        if (char === '"') {
          insideQuote = !insideQuote;
        } else if (char === ',' && !insideQuote) {
          arr.push(entry.trim());
          entry = '';
        } else {
          entry += char;
        }
      }
      arr.push(entry.trim());

      if (arr.length >= headers.length) {
        let obj = {};
        // Asignamos dinámicamente por posición y por el nombre de columna detectado
        headers.forEach((h, index) => {
          let val = arr[index] ? arr[index].replace(/^"|"$/g, '') : '';
          obj[h] = val;
        });
        
        // Mapeos posicionales de respaldo por si varían acentos o nombres de cabeceras
        obj.categoria = obj.categoria || arr[0];
        obj.archivo = obj.archivo || arr[1];
        obj.url = obj.url || arr[2];
        obj.fecha = obj.fecha || arr[3];
        obj.extra_info = obj.extra_info || arr[4];
        obj.pagina = arr[5] || '1';
        
        rows.push(obj);
      }
    }
    return rows;
  }

  async function cargarBaseDeDatosCSV() {
    try {
      progressBar.value = 30;
      const respuesta = await fetch('indice_documentos.csv');
      if (!respuesta.ok) throw new Error("No se encontró el índice CSV.");
      
      const textoCSV = await respuesta.text();
      progressBar.value = 70;
      
      baseDocumentosIndexados = parsearCSV(textoCSV);
      progressBar.value = 100;
      
      descCargandoStatus.textContent = "✓ Índice local cargado";
      
      procesarMetadatosYDescargas();
      mostrarUltimaActualizacion();
    } catch (err) {
      console.error(err);
      descCargandoStatus.textContent = "❌ Error cargando CSV";
      ultimaDiv.textContent = "Error al inicializar la base de datos remota.";
    }
  }

  // Extrae de forma segura una fecha YYYYMMDD para ordenamiento y lógica de calendarios
  function obtenerFechaYYYYMMDD(obj) {
    if (obj.fecha && /^\d{8}$/.test(obj.fecha)) return obj.fecha;
    if (obj.fecha && /^\d{4}-\d{2}-\d{2}$/.test(obj.fecha)) return obj.fecha.replace(/-/g, '');
    
    // Si en 'fecha' viene el número de Expediente (como '2882-41-10'), buscamos el año real en el nombre del archivo
    const matchAnno = obj.archivo ? obj.archivo.match(/(202\d)/) : null;
    if (matchAnno) return matchAnno[1] + "0101"; 
    
    return "20260101"; // Fallback por defecto para mantener consistencia este año
  }

  // Intenta extraer el identificador limpio (ej: 052250-1) de la URL o el archivo
  function extraerCodigoLimpio(obj) {
    if (obj.url) {
      const matchUrl = obj.url.match(/\/([^\/]+)\.pdf$/);
      if (matchUrl) return matchUrl[1];
    }
    const matchArchivo = obj.archivo ? obj.archivo.match(/_([0-9-]+)_/) : null;
    return matchArchivo ? matchArchivo[1] : (obj.fecha && obj.fecha.includes('-') ? obj.fecha : 'S/N');
  }

  function mostrarUltimaActualizacion() {
    ultimaDiv.innerHTML = '<div style="display:flex; flex-wrap:wrap; gap:0.8rem; font-size:0.85rem; background:#fff; padding:0.6rem; border-radius:6px; border:1px solid #ccc; justify-content:center;"></div>';
    const container = ultimaDiv.firstChild;

    Object.keys(CONFIG_CATEGORIAS).forEach(key => {
      const conf = CONFIG_CATEGORIAS[key];
      const subGrupo = baseDocumentosIndexados.filter(d => d.categoria === key);
      
      if (subGrupo.length === 0) {
        container.innerHTML += `<span style="border-left: 4px solid #ccc; padding-left:5px; color:#666;"><strong>${conf.label}:</strong> Sin datos</span>`;
        return;
      }

      subGrupo.sort((a,b) => obtenerFechaYYYYMMDD(b).localeCompare(obtenerFechaYYYYMMDD(a)));
      const ultimo = subGrupo[0];
      const idDoc = extraerCodigoLimpio(ultimo);
      
      container.innerHTML += `<span style="border-left: 4px solid ${conf.colorHex}; padding-left:5px;"><strong>${conf.label}:</strong> N.º ${idDoc}</span>`;
    });
  }

  function cargarPDF(urlCompleta) {
    pdfPreview.innerHTML = '<p>Cargando visor de PDF…</p>';
    const iframe = document.createElement('iframe');
    iframe.src = urlCompleta;
    pdfPreview.innerHTML = '';
    pdfPreview.appendChild(iframe);
  }

  function realizarBusqueda() {
    const q = busquedaInput.value.trim();
    if (!q) return;

    const categoriasActivas = [];
    if(document.getElementById('cat-boletines').checked) categoriasActivas.push('boletines');
    if(document.getElementById('cat-licitaciones').checked) categoriasActivas.push('licitaciones');
    if(document.getElementById('cat-hcd-orden').checked) categoriasActivas.push('hcd_orden');
    if(document.getElementById('cat-hcd-taqui').checked) categoriasActivas.push('hcd_taqui');

    if (categoriasActivas.length === 0) {
      resultadosDiv.innerHTML = '<p>Seleccioná al menos una categoría.</p>';
      return;
    }

    statusDiv.textContent = 'Buscando en base local…';
    resultadosDiv.innerHTML = '';
    pdfPreview.innerHTML = '';

    let regex;
    const mode = document.querySelector('input[name="searchType"]:checked').value;
    if (mode === 'endsWith') regex = new RegExp(q + '$', 'i');
    else if (mode === 'or') regex = new RegExp(q.split('|').join('|'), 'i');
    else regex = new RegExp(q, 'i');

    // Buscamos dentro de 'extra_info' (el fragmento indexado) o en el nombre del archivo
    let matches = baseDocumentosIndexados.filter(obj => {
      if (!categoriasActivas.includes(obj.categoria)) return false;
      const textoTarget = (obj.extra_info || '') + ' ' + (obj.archivo || '');
      return regex.test(textoTarget);
    });

    // Filtros de fecha mensuales
    const desde = desdeInput.value ? desdeInput.value.replace(/-/g, '') + '00' : null;
    const hasta = hastaInput.value ? hastaInput.value.replace(/-/g, '') + '32' : null;

    if (desde) matches = matches.filter(m => obtenerFechaYYYYMMDD(m) >= desde);
    if (hasta) matches = matches.filter(m => obtenerFechaYYYYMMDD(m) <= hasta);

    matches.sort((a, b) => {
      const da = obtenerFechaYYYYMMDD(a), db = obtenerFechaYYYYMMDD(b);
      return ordenSelect.value === 'asc' ? da.localeCompare(db) : db.localeCompare(da);
    });

    statusDiv.textContent = '';
    if (!matches.length) {
      resultadosDiv.innerHTML = '<p>No se encontraron resultados.</p>';
      contadorDiv.textContent = '0 resultados';
      return;
    }

    contadorDiv.textContent = `${matches.length} resultados`;
    
    // Auto-precarga el primer PDF
    const primero = matches[0];
    cargarPDF(`${primero.url}#page=${primero.pagina || 1}`);

    matches.forEach(m => {
      const fechaRaw = obtenerFechaYYYYMMDD(m);
      const anno = fechaRaw.slice(0, 4);
      const idDoc = extraerCodigoLimpio(m);
      
      // Si la columna fecha contiene un expediente real lo añadimos como dato extra visible
      const expDato = m.fecha && m.fecha.includes('-') ? ` (Exp. ${m.fecha})` : '';
      const conf = CONFIG_CATEGORIAS[m.categoria] || { label: 'Documento', badgeClass: '', resultClass: '', colorHex: '#666' };

      const div = document.createElement('div');
      div.className = `resultado ${conf.resultClass}`; 
      div.innerHTML = `
        <div class="linea">
          <span class="badge ${conf.badgeClass}">${conf.label}</span>
          <a href="${m.url}" target="_blank">${conf.label} N.º ${idDoc}${expDato} – Año ${anno}</a> (pág. ${m.pagina || 1})
        </div>
        <div class="fragmento">${(m.extra_info || 'Sin descripción').replace(regex, '<mark>$&</mark>')}</div>
      `;
      
      div.onclick = (e) => { 
        if(e.target.tagName !== 'A') cargarPDF(`${m.url}#page=${m.pagina || 1}`); 
      };
      resultadosDiv.appendChild(div);
    });
  }

  function procesarMetadatosYDescargas() {
    let mapeoDocsUnicos = {};
    let annosExistentes = new Set();

    baseDocumentosIndexados.forEach(obj => {
      if (!obj.url) return;
      if (!mapeoDocsUnicos[obj.url]) {
        const fecha8 = obtenerFechaYYYYMMDD(obj);
        const anno = fecha8.slice(0, 4);
        const mes = fecha8.slice(4, 6);
        annosExistentes.add(anno);

        mapeoDocsUnicos[obj.url] = {
          url: obj.url,
          categoriaKey: obj.categoria,
          anno: anno,
          mes: mes,
          identificador: extraerCodigoLimpio(obj),
          fecha8: fecha8
        };
      }
    });

    documentosUnicosParaDescarga = Object.values(mapeoDocsUnicos);
    
    descFiltroAnno.innerHTML = '<option value="TODOS">Todos los años</option>';
    Array.from(annosExistentes).sort((a, b) => b.localeCompare(a)).forEach(a => {
      descFiltroAnno.innerHTML += `<option value="${a}">${a}</option>`;
    });

    renderizarEnlacesIndice();
  }

  function renderizarEnlacesIndice() {
    if (documentosUnicosParaDescarga.length === 0) {
      descContenedorEnlaces.innerHTML = '<span style="color:#888; font-size:0.85rem;">No hay registros cargados.</span>';
      return;
    }

    const boletinesChecked = document.getElementById('cat-boletines').checked;
    const licitacionesChecked = document.getElementById('cat-licitaciones').checked;
    const ordenesChecked = document.getElementById('cat-hcd-orden').checked;
    const taquiChecked = document.getElementById('cat-hcd-taqui').checked;

    const annoFiltro = descFiltroAnno.value;
    const desagregarM = descDesagregarMensual.checked;

    let filtrados = documentosUnicosParaDescarga.filter(d => {
      if (d.categoriaKey === 'boletines' && !boletinesChecked) return false;
      if (d.categoriaKey === 'licitaciones' && !licitacionesChecked) return false;
      if (d.categoriaKey === 'hcd_orden' && !ordenesChecked) return false;
      if (d.categoriaKey === 'hcd_taqui' && !taquiChecked) return false;
      return true;
    });

    if (annoFiltro !== 'TODOS') filtrados = filtrados.filter(d => d.anno === annoFiltro);
    filtrados.sort((a, b) => b.fecha8.localeCompare(a.fecha8));

    descContenedorEnlaces.innerHTML = '';
    const mesesNombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

    if (desagregarM) {
      let agrupados = {};
      filtrados.forEach(d => {
        if (!agrupados[d.anno]) agrupados[d.anno] = {};
        if (!agrupados[d.anno][d.mes]) agrupados[d.anno][d.mes] = [];
        agrupados[d.anno][d.mes].push(d);
      });

      Object.keys(agrupados).sort((a, b) => b.localeCompare(a)).forEach(a => {
        Object.keys(agrupados[a]).sort((a, b) => b.localeCompare(a)).forEach(m => {
          const mNombre = mesesNombres[parseInt(m, 10) - 1] || `Mes ${m}`;
          const bloque = document.createElement('div');
          bloque.innerHTML = `<div style="font-weight:bold; font-size:0.85rem; color:#2c3e50; border-bottom:1px solid #e2e8f0; margin-top:0.3rem; padding-bottom:1px;">📂 ${mNombre} ${a}</div>`;
          
          const wrapper = document.createElement('div');
          wrapper.style.display = 'flex'; wrapper.style.flexWrap = 'wrap'; wrapper.style.gap = '0.4rem'; wrapper.style.padding = '0.3rem 0';
          
          agrupados[a][m].forEach(doc => { wrapper.appendChild(crearElementoLink(doc)); });
          bloque.appendChild(wrapper);
          descContenedorEnlaces.appendChild(bloque);
        });
      });
    } else {
      let agrupadosAnno = {};
      filtrados.forEach(d => {
        if (!agrupadosAnno[d.anno]) agrupadosAnno[d.anno] = [];
        agrupadosAnno[d.anno].push(d);
      });

      Object.keys(agrupadosAnno).sort((a, b) => b.localeCompare(a)).forEach(a => {
        const bloque = document.createElement('div');
        bloque.innerHTML = `<div style="font-weight:bold; font-size:0.85rem; color:#2c3e50; border-bottom:1px solid #e2e8f0; margin-top:0.3rem; padding-bottom:1px;">🗓️ Año ${a}</div>`;
        
        const wrapper = document.createElement('div');
        wrapper.style.display = 'flex'; wrapper.style.flexWrap = 'wrap'; wrapper.style.gap = '0.4rem'; wrapper.style.padding = '0.3rem 0';
        
        agrupadosAnno[a].forEach(doc => { wrapper.appendChild(crearElementoLink(doc)); });
        bloque.appendChild(wrapper);
        descContenedorEnlaces.appendChild(bloque);
      });
    }
  }

  function crearElementoLink(doc) {
    const conf = CONFIG_CATEGORIAS[doc.categoriaKey] || { label: 'Doc', colorHex: '#666' };
    const link = document.createElement('a');
    link.href = doc.url; 
    link.target = '_blank';
    link.style.textDecoration = 'none'; link.style.fontSize = '0.78rem'; link.style.padding = '0.2rem 0.4rem';
    link.style.borderRadius = '4px'; link.style.color = '#fff'; link.style.fontWeight = 'bold'; link.style.display = 'inline-block';
    link.style.backgroundColor = conf.colorHex;
    link.textContent = `${conf.label} N.º ${doc.identificador}`;
    return link;
  }

  descFiltroAnno.addEventListener('change', renderizarEnlacesIndice);
  descDesagregarMensual.addEventListener('change', renderizarEnlacesIndice);
  document.getElementById('cat-boletines').addEventListener('change', renderizarEnlacesIndice);
  document.getElementById('cat-licitaciones').addEventListener('change', renderizarEnlacesIndice);
  document.getElementById('cat-hcd-orden').addEventListener('change', renderizarEnlacesIndice);
  document.getElementById('cat-hcd-taqui').addEventListener('change', renderizarEnlacesIndice);

  botonBuscar.addEventListener('click', realizarBusqueda);
  busquedaInput.addEventListener('keydown', e => { if(e.key === 'Enter') realizarBusqueda(); });

  cargarBaseDeDatosCSV();
</script>
</body>
</html>
