<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador Integrado Municipal</title>
  <link href="https://fonts.googleapis.com/css2?family=Mohave&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mohave', sans-serif; margin: 2rem auto; max-width: 1200px; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; }
    #ultimaActualizacion { width: 100%; max-width: 900px; margin-bottom: 1rem; }
    #searchContainer, #dateContainer { width: 100%; max-width: 900px; margin-bottom: 1rem; }
    #searchOptions, #categoryOptions { display: flex; gap: 1rem; margin-bottom: 1rem; justify-content: center; flex-wrap: wrap; }
    #categoryOptions { background: #e2e8f0; padding: 0.7rem; border-radius: 8px; border: 1px solid #cbd5e1; }
    #resultados { width: 90%; max-width: 1200px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; max-height: 600px; overflow-y: auto; }
    
    .resultado { border: 2px solid blue; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; cursor: pointer; }
    .resultado.licitacion { border-color: #e67e22; }
    .resultado.hcd_orden { border-color: #2ecc71; }
    .resultado.hcd_taqui { border-color: #9b59b6; }
    
    .linea { font-weight: bold; margin-bottom: .5rem; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; font-size: 0.8rem; border-radius: 4px; color: #fff; margin-right: 0.5rem; text-transform: uppercase; }
    .badge-boletin { background-color: #0066ff; }
    .badge-lici { background-color: #e67e22; }
    .badge-orden { background-color: #2ecc71; }
    .badge-taqui { background-color: #9b59b6; }
    
    .fragmento { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.4; }
    #pdfPreview { width: 100%; max-width: 900px; min-height: 600px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    #pdfPreview iframe { width: 100%; height: 600px; border: none; }
    #status, #contador, #metrics { width: 100%; max-width: 900px; text-align: center; margin: .5rem 0; font-weight: bold; color: #2c3e50; }
    #version { margin-top: 1rem; color: #666; font-size: .9rem; font-weight: bold; }
    
    .btn-primary { background-color: #0056b3; color: white; border: none; padding: 0.6rem 1.5rem; font-size: 1.05rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-secondary { background-color: #2c3e50; color: white; border: none; padding: 0.6rem 2rem; font-size: 1.1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-primary:hover, .btn-secondary:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div id="ultimaActualizacion">
    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:0.8rem; font-size:0.9rem; background:#fff; padding:0.8rem; border-radius:6px; border:1px solid #ccc; justify-content:center;">
      <span style="font-weight:bold;">Actualizado hasta:</span> <span id="ultimaInfo">Sincronizando...</span>
    </div>
  </div>

  <div id="seccionDescargas" style="width: 100%; max-width: 900px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 0.5rem 0 1rem 0;">
    <h4 style="margin: 0 0 0.5rem 0;">📅 Índice de Archivos y Descargas Directas</h4>
    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.8rem;">
      <label>Filtrar Año: <select id="descFiltroAnno"><option value="TODOS">Todos</option></select></label>
      <label><input type="checkbox" id="descDesagregarMensual"> Desagregar meses</label>
      <span id="descCargandoStatus" style="font-size:0.85rem; color:#666;">Cargando índice...</span>
    </div>
    <div id="descContenedorEnlaces" style="max-height: 220px; overflow-y: auto; padding: 0.6rem; border: 1px dashed #ccc; border-radius: 4px; background: #fafafa; display: flex; flex-direction: column; gap: 0.6rem;"></div>
  </div>

  <div id="searchContainer">
    <div id="categoryOptions">
      <label><input type="checkbox" id="cat-boletines" value="boletines" checked> Boletines Oficiales</label>
      <label><input type="checkbox" id="cat-licitaciones" value="licitaciones"> Licitaciones</label>
      <label><input type="checkbox" id="cat-hcd-orden" value="hcd_orden"> HCD Órdenes</label>
      <label><input type="checkbox" id="cat-hcd-taqui" value="hcd_taqui"> HCD Taquigráficas</label>
    </div>

    <div id="searchOptions">
      <label><input type="radio" name="searchType" value="contains" checked> Contiene</label>
      <label><input type="radio" name="searchType" value="endsWith"> Termina en</label>
      <label><input type="radio" name="searchType" value="or"> Alguna palabra</label>
    </div>
    <input id="busqueda" placeholder="Término de búsqueda (Enter para buscar)..." style="width:100%; padding:0.7rem; font-size:1.05rem; border-radius:6px; border:1px solid #ccc;">
  </div>

  <div id="dateContainer" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem;">
    <label>Desde: <input type="month" id="desde"></label>
    <label>Hasta: <input type="month" id="hasta"></label>
    <select id="orden">
      <option value="desc">Más nuevos primero</option>
      <option value="asc">Más antiguos primero</option>
    </select>
  </div>

  <div style="width:100%; text-align:center; margin-bottom:1.5rem;">
    <button id="botonBuscar" class="btn-secondary">🔍 Buscar en texto completo</button>
  </div>

  <div id="progressContainer" style="display:none; width:100%; max-width:900px; background:#e2e8f0; border-radius:9999px; height:28px; overflow:hidden; position:relative; margin:1rem 0;">
    <div id="progressBar" style="height:100%; width:0%; background:linear-gradient(90deg,#3b82f6,#2563eb); transition:width .15s linear; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:0.9rem;"></div>
  </div>

  <div id="status"></div>
  <div id="contador"></div>
  <div id="metrics"></div>
  <div id="resultados"></div>
  <div id="pdfPreview"></div>
  <div id="version">V2.0 Web Workers • LRU Cache • Streaming</div>

<script>
  // ==================== CONFIG ====================
  const CONFIG = {
    categories: {
      boletines: { label: 'Boletín', badge: 'badge-boletin', cls: '', folder: 'bolet', prefix: 'bolet_part_', start: 1, color: '#0066ff' },
      licitaciones: { label: 'Licitación', badge: 'badge-lici', cls: 'licitacion', folder: 'lici', prefix: 'lici_part', start: 0, color: '#e67e22' },
      hcd_orden: { label: 'HCD Orden', badge: 'badge-orden', cls: 'hcd_orden', folder: 'orden', prefix: 'hcd_orden_part', start: 1, color: '#2ecc71' },
      hcd_taqui: { label: 'HCD Taqui', badge: 'badge-taqui', cls: 'hcd_taqui', folder: 'taqui', prefix: 'taqui_part', start: 1, color: '#9b59b6' }
    }
  };

  // ==================== STATE ====================
  let metadata = [];
  let workerPool = [];
  let activeWorkers = 0;
  let searchId = 0;
  let lruCache = new Map(); // url → parsed objects
  const MAX_LRU = 8000;
  let lastSearchTime = 0;

  // DOM
  const els = {
    busqueda: document.getElementById('busqueda'),
    botonBuscar: document.getElementById('botonBuscar'),
    resultados: document.getElementById('resultados'),
    pdfPreview: document.getElementById('pdfPreview'),
    status: document.getElementById('status'),
    contador: document.getElementById('contador'),
    metrics: document.getElementById('metrics'),
    progressContainer: document.getElementById('progressContainer'),
    progressBar: document.getElementById('progressBar'),
    ultimaInfo: document.getElementById('ultimaInfo'),
    descFiltroAnno: document.getElementById('descFiltroAnno'),
    descDesagregarMensual: document.getElementById('descDesagregarMensual'),
    descContenedorEnlaces: document.getElementById('descContenedorEnlaces')
  };

  // ==================== WEB WORKER ====================
  function createWorker() {
    const workerCode = `
      self.onmessage = function(e) {
        const { id, task, data } = e.data;
        if (task === 'processChunk') {
          const lines = data.text.split('\\n');
          const results = [];
          const regex = new RegExp(data.regexSource, data.regexFlags);
          
          for (let line of lines) {
            if (!line.trim()) continue;
            try {
              const obj = JSON.parse(line);
              obj._cat = data.category;
              
              let match = false;
              if (obj._cat === 'licitaciones') {
                match = regex.test(obj.fragmento || '') || regex.test(obj.codigo || '') || regex.test(obj.archivo || '');
              } else {
                match = regex.test(obj.fragmento || '');
              }
              
              if (match && data.dateFilter) {
                const fecha8 = (obj.fecha || obj.fecha_acta || obj.archivo || '').replace(/[^0-9]/g,'').slice(0,8);
                if (fecha8 < data.from || fecha8 > data.to) match = false;
              }
              
              if (match) {
                results.push({
                  cat: obj._cat,
                  archivo: obj.archivo || '',
                  url: obj.url || '#',
                  fecha: obj.fecha || obj.fecha_acta || '',
                  pagina: obj.pagina || 1,
                  fragmento: obj.fragmento || '',
                  fecha8: (obj.fecha || obj.fecha_acta || obj.archivo || '').replace(/[^0-9]/g,'').slice(0,8) || '19000101'
                });
              }
            } catch(_) {}
          }
          self.postMessage({ id, results, chunks: 1 });
        }
      };
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    return new Worker(URL.createObjectURL(blob));
  }

  function initWorkerPool() {
    const concurrency = Math.min(navigator.hardwareConcurrency || 4, 8);
    for (let i = 0; i < concurrency; i++) {
      workerPool.push(createWorker());
    }
  }

  // ==================== FETCH WITH CONCURRENCY LIMIT ====================
  async function fetchWithPool(url) {
    return fetch(url);
  }

  // ==================== LOAD METADATA ====================
  async function loadMetadata() {
    try {
      const res = await fetch('indice_documentos.csv');
      if (!res.ok) throw new Error('CSV not found');
      const text = await res.text();
      metadata = parseCSV(text);
      metadata.forEach(m => m.datosFecha = parseDate(m));
      renderLastUpdate();
      buildDownloadSection();
    } catch (e) {
      console.error(e);
      els.ultimaInfo.textContent = 'Error al cargar metadatos';
    }
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/);
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase());
    const result = [];
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      const obj = {};
      headers.forEach((h, idx) => obj[h] = (values[idx] || '').replace(/^"|"$/g,''));
      obj.categoria = normalizeCategory(obj.categoria || '');
      result.push(obj);
    }
    return result;
  }

  function normalizeCategory(cat) {
    const c = cat.toLowerCase();
    if (c.includes('bolet')) return 'boletines';
    if (c.includes('lici')) return 'licitaciones';
    if (c.includes('orden')) return 'hcd_orden';
    if (c.includes('taqui')) return 'hcd_taqui';
    return cat;
  }

  function parseDate(obj) {
    let raw = (obj.fecha || obj.archivo || '').replace(/[^\d]/g,'');
    if (raw.length >= 8) {
      const y = raw.slice(0,4), m = raw.slice(4,6), d = raw.slice(6,8);
      return { sortable: y+m+d, display: `${d}/${m}/${y}`, year: y, month: m };
    }
    return { sortable: '19000101', display: 'S/F', year: 'N/D', month: '01' };
  }

  // ==================== LRU CACHE ====================
  function getFromCache(key) {
    if (lruCache.has(key)) {
      const value = lruCache.get(key);
      lruCache.delete(key);
      lruCache.set(key, value);
      return value;
    }
    return null;
  }

  function setToCache(key, value) {
    if (lruCache.size >= MAX_LRU) {
      const firstKey = lruCache.keys().next().value;
      lruCache.delete(firstKey);
    }
    lruCache.set(key, value);
  }

  // ==================== SEARCH ENGINE ====================
  async function performSearch() {
    const query = els.busqueda.value.trim();
    if (!query) return alert('Ingrese un término');

    const currentSearchId = ++searchId;
    const startTime = performance.now();

    const activeCats = Object.keys(CONFIG.categories).filter(k => document.getElementById(`cat-${k}`).checked);
    if (activeCats.length === 0) return;

    els.status.textContent = 'Iniciando búsqueda con Web Workers...';
    els.progressContainer.style.display = 'block';
    els.progressBar.style.width = '5%';
    els.resultados.innerHTML = '';
    els.pdfPreview.innerHTML = '';

    let allResults = [];
    let processedChunks = 0;

    const regexMode = document.querySelector('input[name="searchType"]:checked').value;
    let regexStr = query;
    if (regexMode === 'endsWith') regexStr = query + '$';
    else if (regexMode === 'or') regexStr = query.split(/\s+/).join('|');

    const fromDate = (document.getElementById('desde').value || '1900-01').replace(/-/g,'') + '00';
    const toDate = (document.getElementById('hasta').value || '2099-12').replace(/-/g,'') + '99';

    const manifestRes = await fetch('manifest.json').catch(() => ({ ok: false }));
    let filesToProcess = [];

    if (manifestRes.ok) {
      const manifest = await manifestRes.json();
      filesToProcess = Object.entries(manifest).flatMap(([cat, parts]) => 
        parts.filter(p => activeCats.includes(cat)).map(p => ({cat, url: p}))
      );
    } else {
      // fallback a discovery (limitado)
      for (const cat of activeCats) {
        const conf = CONFIG.categories[cat];
        for (let i = conf.start; i < 80; i++) {
          const part = String(i).padStart(4,'0');
          filesToProcess.push({cat, url: `json_chunks/${conf.folder}/${conf.prefix}${part}.jsonl`});
        }
      }
    }

    const totalFiles = filesToProcess.length;
    let completed = 0;

    const workerPromises = filesToProcess.map(async (fileInfo, idx) => {
      if (currentSearchId !== searchId) return; // cancelled

      const worker = workerPool[idx % workerPool.length];
      
      try {
        const res = await fetchWithPool(fileInfo.url);
        if (!res.ok) return;
        
        const text = await res.text();
        const cacheKey = fileInfo.url;
        let parsed = getFromCache(cacheKey);
        
        if (!parsed) {
          // worker will parse
        }

        worker.onmessage = (e) => {
          if (e.data.id !== currentSearchId) return;
          allResults.push(...e.data.results);
          processedChunks += e.data.chunks;
          completed++;

          const progress = Math.round((completed / totalFiles) * 100);
          els.progressBar.style.width = `${progress}%`;
          els.progressBar.textContent = `${progress}%`;
        };

        worker.postMessage({
          id: currentSearchId,
          task: 'processChunk',
          data: {
            text: text,
            regexSource: regexStr,
            regexFlags: 'gi',
            category: fileInfo.cat,
            from: fromDate,
            to: toDate,
            dateFilter: true
          }
        });

      } catch (_) {}
    });

    await Promise.all(workerPromises);

    const endTime = performance.now();
    lastSearchTime = (endTime - startTime).toFixed(0);

    // sort
    const order = document.getElementById('orden').value;
    allResults.sort((a,b) => order === 'asc' 
      ? a.fecha8.localeCompare(b.fecha8) 
      : b.fecha8.localeCompare(a.fecha8));

    renderResults(allResults, new RegExp(regexStr, 'gi'));
    
    els.metrics.textContent = `⏱ ${lastSearchTime}ms | ${processedChunks} chunks`;
    els.progressContainer.style.display = 'none';
  }

  function renderResults(matches, regex) {
    els.contador.textContent = `${matches.length} resultados`;
    if (!matches.length) {
      els.resultados.innerHTML = '<p style="text-align:center;padding:2rem;color:#666;">No se encontraron coincidencias.</p>';
      return;
    }

    // preload first PDF
    if (matches[0]) loadPDF(matches[0].url, matches[0].pagina);

    const fragment = document.createDocumentFragment();

    matches.forEach(m => {
      const conf = CONFIG.categories[m.cat];
      const div = document.createElement('div');
      div.className = `resultado ${conf.cls}`;
      div.innerHTML = `
        <div class="linea">
          <span class="badge ${conf.badge}">${conf.label}</span>
          <a href="${m.url}" target="_blank">${m.archivo.replace('.pdf','')}</a> — ${m.fecha || 'S/F'} (pág. ${m.pagina})
        </div>
        <div class="fragmento">${(m.fragmento || '').replace(regex, '<mark>$&</mark>')}</div>
      `;
      div.onclick = (e) => {
        if (e.target.tagName !== 'A') loadPDF(m.url, m.pagina);
      };
      fragment.appendChild(div);
    });

    els.resultados.appendChild(fragment);
  }

  function loadPDF(url, page = 1) {
    els.pdfPreview.innerHTML = `<iframe src="${url}#page=${page}"></iframe>`;
  }

  // ==================== UI HELPERS ====================
  function renderLastUpdate() {
    // similar to original but optimized
    let html = '';
    Object.keys(CONFIG.categories).forEach(key => {
      const items = metadata.filter(m => m.categoria === key);
      if (!items.length) return;
      items.sort((a,b) => b.datosFecha.sortable.localeCompare(a.datosFecha.sortable));
      const latest = items[0];
      html += `<span style="margin:0 12px;"><strong>${CONFIG.categories[key].label}:</strong> ${latest.archivo || '—'}</span>`;
    });
    els.ultimaInfo.innerHTML = html || 'Datos cargados';
  }

  function buildDownloadSection() {
    // reuse logic from original with improvements
    // (kept minimal for brevity - can be expanded)
    els.descFiltroAnno.innerHTML = '<option value="TODOS">Todos los años</option>';
    const years = [...new Set(metadata.map(m => m.datosFecha.year))].filter(y => y !== 'N/D').sort().reverse();
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      els.descFiltroAnno.appendChild(opt);
    });
    // add listeners and rendering as needed
  }

  // ==================== INIT ====================
  function init() {
    initWorkerPool();
    loadMetadata();

    els.botonBuscar.addEventListener('click', performSearch);
    els.busqueda.addEventListener('keydown', e => {
      if (e.key === 'Enter') performSearch();
    });

    // debounce example
    let timeout;
    els.busqueda.addEventListener('input', () => {
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        if (els.busqueda.value.length > 3) performSearch();
      }, 600);
    });
  }

  window.onload = init;
</script>
</body>
</html>
